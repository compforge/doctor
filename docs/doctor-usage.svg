<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">How to use Doctor from a deployment machine</title>
  <desc id="desc">An operator runs the Doctor CLI on a deployment machine. Doctor uses that machine's scoped kubeconfig to access Kubernetes, runs explicitly authorized diagnostics, and returns artifacts and reports to the same machine.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <style>
      .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .muted { fill: #64748b; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
      .heading { font-size: 25px; font-weight: 700; }
      .subheading { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .chip { font-size: 14px; font-weight: 600; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 14px; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#ffffff"/>

  <text class="text heading" x="42" y="45">Use Doctor from a deployment machine</text>
  <text class="text body muted" x="570" y="45">Run locally · access the cluster · bring results back</text>

  <g filter="url(#shadow)">
    <rect x="42" y="82" width="350" height="580" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text class="text label" x="66" y="115" fill="#1d4ed8">DEPLOYMENT MACHINE · DOCTOR HOST</text>

  <rect x="66" y="140" width="302" height="98" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text class="text subheading" x="88" y="172">Run Doctor here</text>
  <rect x="88" y="186" width="256" height="34" rx="9" fill="#172033"/>
  <text class="text mono" x="104" y="208" style="fill: #ffffff">$ doctor &lt;command&gt;</text>

  <path d="M217 238 L217 266" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="66" y="268" width="302" height="112" rx="16" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="text subheading" x="88" y="300">Use local Kubernetes access</text>
  <rect x="88" y="316" width="138" height="34" rx="17" fill="#fef3c7"/>
  <text class="text mono" x="102" y="338">~/.kube/config</text>
  <text class="text small muted" x="88" y="367">Context and RBAC limit what Doctor can do</text>

  <path d="M217 380 L217 430" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="66" y="432" width="302" height="188" rx="16" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="text subheading" x="88" y="466">Get results back here</text>
  <text class="text body muted" x="88" y="493">Reports and raw artifacts stay onsite</text>
  <rect x="88" y="530" width="74" height="30" rx="15" fill="#dbeafe"/>
  <text class="text chip" x="105" y="550">pyheap</text>
  <rect x="170" y="530" width="66" height="30" rx="15" fill="#dbeafe"/>
  <text class="text chip" x="187" y="550">pcap</text>
  <rect x="244" y="530" width="76" height="30" rx="15" fill="#dbeafe"/>
  <text class="text chip" x="262" y="550">logs</text>
  <rect x="88" y="570" width="100" height="30" rx="15" fill="#dbeafe"/>
  <text class="text chip" x="109" y="590">HTML report</text>
  <rect x="198" y="570" width="122" height="30" rx="15" fill="#dbeafe"/>
  <text class="text chip" x="219" y="590">Evidence bundle</text>

  <g filter="url(#shadow)">
    <rect x="458" y="260" width="196" height="126" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <text class="text label" x="484" y="291" fill="#6d28d9">KUBERNETES API</text>
  <text class="text subheading" x="484" y="326">Scoped access</text>
  <text class="text body muted" x="484" y="353">inspect · exec · forward</text>

  <path d="M368 324 L456 324" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text class="text small muted" x="377" y="299">authenticated</text>

  <g filter="url(#shadow)">
    <rect x="720" y="82" width="438" height="580" rx="20" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  </g>
  <text class="text label muted" x="744" y="115">KUBERNETES CLUSTER</text>
  <text class="text small muted" x="929" y="115">selected namespace</text>

  <rect x="744" y="140" width="390" height="206" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text class="text label" x="766" y="170" fill="#b45309">TARGET POD</text>
  <text class="text small muted" x="880" y="170">application-a-0</text>
  <rect x="766" y="190" width="150" height="120" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="text subheading" x="789" y="230">Business</text>
  <text class="text subheading" x="789" y="254">container</text>
  <text class="text small muted" x="789" y="285">application process</text>
  <rect x="936" y="190" width="176" height="120" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="text subheading" x="958" y="224">Debug container</text>
  <text class="text body muted" x="958" y="252">pyheap · tcpdump</text>
  <text class="text body muted" x="958" y="278">gdb · diagnostics</text>

  <rect x="744" y="376" width="390" height="206" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text class="text label" x="766" y="406" fill="#b45309">TARGET POD</text>
  <text class="text small muted" x="880" y="406">application-b-0</text>
  <rect x="766" y="426" width="150" height="120" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="text subheading" x="789" y="466">Business</text>
  <text class="text subheading" x="789" y="490">container</text>
  <text class="text small muted" x="789" y="521">application process</text>
  <rect x="936" y="426" width="176" height="120" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="text subheading" x="958" y="460">Debug container</text>
  <text class="text body muted" x="958" y="488">tcpdump · network</text>
  <text class="text body muted" x="958" y="514">temporary tools</text>

  <path d="M654 303 C690 270 704 246 742 246" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M654 343 C690 382 704 482 742 482" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text class="text small muted" x="661" y="248">select / inspect</text>
  <text class="text small muted" x="661" y="462">collect</text>

  <path d="M1024 582 L1024 690 L217 690 L217 622" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text class="text body" x="557" y="715" fill="#047857">artifacts: .pyheap · .pcap · logs · metrics</text>

  <text class="text small muted" x="42" y="744">Blue: Doctor-controlled access · Green: evidence returned to the Host · Debug containers are temporary and explicitly authorized</text>
</svg>
