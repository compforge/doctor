<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Run Doctor on a Linux machine in the customer environment</title>
  <desc id="desc">The Doctor CLI runs as a local process on a Linux machine in the customer environment. It uses that machine's kubeconfig and network to make RBAC-scoped Kubernetes API requests, then writes artifacts and reports back to its local filesystem.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <style>
      .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .muted { fill: #64748b; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
      .heading { font-size: 25px; font-weight: 700; }
      .subheading { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .chip { font-size: 14px; font-weight: 600; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 14px; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#ffffff"/>

  <text class="text heading" x="42" y="45">Run Doctor on a customer-site Linux machine</text>
  <text class="text body muted" x="650" y="45">Local process · scoped access · local results</text>

  <rect x="42" y="82" width="350" height="118" rx="16" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="text label" x="66" y="112" fill="#1d4ed8">LOCAL INPUT · LINUX FILESYSTEM</text>
  <text class="text subheading" x="66" y="154">Kubeconfig</text>
  <rect x="214" y="130" width="154" height="34" rx="17" fill="#fef3c7"/>
  <text class="text mono" x="228" y="152">~/.kube/config</text>
  <text class="text small muted" x="66" y="186">Context and RBAC bound every request</text>

  <path d="M217 200 L217 228" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-blue)"/>
  <text class="text small muted" x="228" y="220">reads</text>

  <g filter="url(#shadow)">
    <rect x="42" y="230" width="350" height="200" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text class="text label" x="66" y="260" fill="#1d4ed8">CUSTOMER-SITE LINUX MACHINE</text>
  <rect x="66" y="280" width="302" height="126" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text class="text label" x="88" y="310" fill="#6d28d9">DOCTOR CLI PROCESS</text>
  <text class="text body muted" x="88" y="335">Runs on this machine as the local user</text>
  <rect x="88" y="351" width="256" height="36" rx="9" fill="#172033"/>
  <text class="text mono" x="104" y="374" style="fill: #ffffff">$ doctor &lt;command&gt;</text>

  <rect x="42" y="462" width="350" height="176" rx="16" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="text label" x="66" y="491" fill="#047857">LOCAL OUTPUT · LINUX FILESYSTEM</text>
  <text class="text subheading" x="66" y="523">Collected data and reports</text>
  <text class="text body muted" x="66" y="550">Written back to the same machine</text>
  <rect x="66" y="566" width="74" height="30" rx="15" fill="#dbeafe"/>
  <text class="text chip" x="83" y="586">pyheap</text>
  <rect x="148" y="566" width="66" height="30" rx="15" fill="#dbeafe"/>
  <text class="text chip" x="165" y="586">pcap</text>
  <rect x="222" y="566" width="76" height="30" rx="15" fill="#dbeafe"/>
  <text class="text chip" x="240" y="586">logs</text>
  <rect x="66" y="602" width="100" height="30" rx="15" fill="#dbeafe"/>
  <text class="text chip" x="87" y="622">HTML report</text>
  <rect x="176" y="602" width="122" height="30" rx="15" fill="#dbeafe"/>
  <text class="text chip" x="197" y="622">Evidence bundle</text>

  <text class="text label" x="446" y="260" fill="#1d4ed8">KUBERNETES API REQUESTS</text>
  <text class="text subheading" x="446" y="288">Uses local credentials</text>
  <text class="text small muted" x="446" y="310">Scope = kubeconfig context + RBAC</text>
  <path d="M368 343 L690 343" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text class="text body muted" x="474" y="371">inspect · exec · port-forward</text>

  <g filter="url(#shadow)">
    <rect x="720" y="82" width="438" height="580" rx="20" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  </g>
  <text class="text label muted" x="744" y="115">KUBERNETES CLUSTER</text>
  <text class="text small muted" x="929" y="115">selected namespace</text>

  <rect x="744" y="140" width="390" height="206" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text class="text label" x="766" y="170" fill="#b45309">TARGET POD</text>
  <text class="text small muted" x="880" y="170">application-a-0</text>
  <rect x="766" y="190" width="150" height="120" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="text subheading" x="789" y="230">Business</text>
  <text class="text subheading" x="789" y="254">container</text>
  <text class="text small muted" x="789" y="285">application process</text>
  <rect x="936" y="190" width="176" height="120" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="text subheading" x="958" y="224">Debug container</text>
  <text class="text body muted" x="958" y="252">pyheap · tcpdump</text>
  <text class="text body muted" x="958" y="278">gdb · diagnostics</text>

  <rect x="744" y="376" width="390" height="206" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text class="text label" x="766" y="406" fill="#b45309">TARGET POD</text>
  <text class="text small muted" x="880" y="406">application-b-0</text>
  <rect x="766" y="426" width="150" height="120" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="text subheading" x="789" y="466">Business</text>
  <text class="text subheading" x="789" y="490">container</text>
  <text class="text small muted" x="789" y="521">application process</text>
  <rect x="936" y="426" width="176" height="120" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="text subheading" x="958" y="460">Debug container</text>
  <text class="text body muted" x="958" y="488">tcpdump · network</text>
  <text class="text body muted" x="958" y="514">temporary tools</text>

  <path d="M690 343 L690 246 L742 246" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M690 343 L690 482 L742 482" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text class="text small muted" x="604" y="238">select / inspect</text>
  <text class="text small muted" x="636" y="466">collect</text>

  <path d="M1024 582 L1024 690 L217 690 L217 640" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text class="text body" x="557" y="715" fill="#047857">artifacts: .pyheap · .pcap · logs · metrics</text>

  <text class="text small muted" x="42" y="744">Blue: API requests from the Linux machine · Green: evidence returned to the Linux machine · Debug containers are temporary and explicitly authorized</text>
</svg>
