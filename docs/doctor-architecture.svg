<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Doctor architecture</title>
  <desc id="desc">Doctor exposes Provision, Collect, and Chat workflows over shared Core access. Versioned Plugins contribute Services, capabilities, models, and Skills. Both Core and Plugins operate on scoped Kubernetes application infrastructure.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <style>
      .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .muted { fill: #64748b; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .chip { font-size: 14px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#ffffff"/>

  <text class="text heading" x="42" y="45">Doctor</text>
  <text class="text body muted" x="145" y="45">Extensible diagnostics for Kubernetes applications</text>

  <rect x="42" y="76" width="1116" height="236" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="text label muted" x="66" y="105">COMMAND WORKFLOWS</text>

  <g filter="url(#shadow)">
    <rect x="66" y="126" width="310" height="154" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="445" y="126" width="310" height="154" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="824" y="126" width="310" height="154" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  </g>

  <text class="text heading" x="90" y="165">Provision</text>
  <text class="text body muted" x="90" y="193">Prepare explicit diagnostic capability</text>
  <rect x="90" y="218" width="114" height="34" rx="17" fill="#ede9fe"/>
  <text class="text chip" x="112" y="240">Host / Target</text>

  <text class="text heading" x="469" y="165">Collect</text>
  <text class="text body muted" x="469" y="193">Turn observations into auditable results</text>
  <rect x="469" y="218" width="106" height="34" rx="17" fill="#ede9fe"/>
  <text class="text chip" x="493" y="240">Evidence</text>
  <rect x="585" y="218" width="126" height="34" rx="17" fill="#ede9fe"/>
  <text class="text chip" x="607" y="240">Findings / report</text>

  <text class="text heading" x="848" y="165">Chat</text>
  <text class="text body muted" x="848" y="193">Investigate with application knowledge</text>
  <rect x="848" y="218" width="88" height="34" rx="17" fill="#fef3c7"/>
  <text class="text chip" x="870" y="240">Agent</text>
  <rect x="946" y="218" width="112" height="34" rx="17" fill="#fef3c7"/>
  <text class="text chip" x="968" y="240">Sandbox</text>

  <path d="M177 340 L177 282" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M368 340 C430 318 500 300 542 282" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M612 340 C700 310 824 293 884 281" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M824 340 C770 318 711 298 670 282" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-green)"/>
  <path d="M1040 340 L1008 282" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="42" y="340" width="646" height="196" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="716" y="340" width="442" height="196" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  </g>

  <text class="text label" x="66" y="371" fill="#1d4ed8">DOCTOR CORE</text>
  <text class="text small muted" x="184" y="371">shared by every workflow</text>
  <rect x="66" y="394" width="270" height="48" rx="12" fill="#dbeafe"/>
  <text class="text chip" x="88" y="424">Profile &amp; target context</text>
  <rect x="350" y="394" width="314" height="48" rx="12" fill="#dbeafe"/>
  <text class="text chip" x="372" y="424">Host &amp; Kubernetes access</text>
  <rect x="66" y="456" width="270" height="48" rx="12" fill="#dbeafe"/>
  <text class="text chip" x="88" y="486">Authorization &amp; approval</text>
  <rect x="350" y="456" width="314" height="48" rx="12" fill="#dbeafe"/>
  <text class="text chip" x="372" y="486">Resource lifecycle &amp; infra tools</text>

  <text class="text label" x="740" y="371" fill="#047857">PLUGIN</text>
  <text class="text small muted" x="808" y="371">versioned application extension</text>
  <rect x="740" y="394" width="180" height="48" rx="12" fill="#d1fae5"/>
  <text class="text chip" x="762" y="424">Service Catalog</text>
  <rect x="934" y="394" width="200" height="48" rx="12" fill="#d1fae5"/>
  <text class="text chip" x="956" y="424">Capabilities</text>
  <rect x="740" y="456" width="180" height="48" rx="12" fill="#d1fae5"/>
  <text class="text chip" x="762" y="486">Model</text>
  <rect x="934" y="456" width="200" height="48" rx="12" fill="#d1fae5"/>
  <text class="text chip" x="956" y="486">Skills</text>

  <path d="M365 536 L365 578" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M937 536 L937 578" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="42" y="580" width="1116" height="136" rx="20" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text class="text label muted" x="66" y="611">TARGETS &amp; INFRASTRUCTURE</text>
  <rect x="66" y="632" width="244" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="text chip" x="92" y="664">Kubernetes / Pods</text>
  <rect x="326" y="632" width="244" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="text chip" x="352" y="664">Services / HTTP</text>
  <rect x="586" y="632" width="244" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="text chip" x="612" y="664">DB / Stores</text>
  <rect x="846" y="632" width="288" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="text chip" x="872" y="664">Model endpoints</text>

  <text class="text small muted" x="42" y="744">Solid blue: Core access · Dashed green: Plugin contribution</text>
</svg>
